description: MetroResidences is a serviced apartments and furnished-rentals platform offering flexible
  temporary housing for business travelers, expatriates, and relocating professionals. Its portfolio
  spans thousands of listings across Singapore, Tokyo, and Australia, ranging from studios to six-plus
  bedroom units in both furnished and unfurnished configurations, alongside select hotel accommodations.
  The company also runs a property-management offering that lets owners list and monetize their units.
  Surfaced as a portfolio company of 500 Global and added to the API Evangelist network; the public
  site exposes no developer program, API, or developer documentation at this time.
